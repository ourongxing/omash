[package]
name = "omash"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "A fast terminal dashboard for Mihomo/Clash"
homepage = "https://github.com/ourongxing/omash"
repository = "https://github.com/ourongxing/omash"
publish = false

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
crossterm = { version = "0.29", features = ["event-stream"] }
dirs = "6"
futures-util = "0.3"
ratatui = "0.30"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.9"
uuid = { version = "1", features = ["v4"] }
zip = { version = "8", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
